name: Build Android App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # Set up and use a pre-installed Gradle environment
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      
    # Generates the debug keystore exactly where your gradle configuration expects it
    - name: Create Debug Keystore
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    # Execute the build directly using the system-installed gradle
    - name: Build with Gradle
      run: gradle assembleDebug -Djava.awt.headless=true

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
